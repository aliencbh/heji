user nginx;
worker_processes auto;
error_log /srv/heji/storage/logs/nginx/error.log warn;
pid /var/run/nginx.pid;
events {worker_connections 1024;}
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 access_log off;
 client_max_body_size 6m;
 map $host $site {
  default "";
  shop.laravel.demo shop;
  stock.laravel.demo stock;
  recipe.laravel.demo recipe;
 }
 server {listen 80 default_server; server_name _; return 444;}
 server {listen 443 ssl default_server; ssl_reject_handshake on;}
 server {
  listen 80;
  server_name shop.laravel.demo stock.laravel.demo recipe.laravel.demo;
  return 308 https://$host$request_uri;
 }
 server {
  listen 443 ssl;
  server_name shop.laravel.demo stock.laravel.demo recipe.laravel.demo;
  ssl_certificate /run/tls/fullchain.pem;
  ssl_certificate_key /run/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /srv/heji/public/$site;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  location ^~ /assets/ {try_files $uri =404;}
  location ~ (?:^|/)\. {return 404;}
  location ~* \.php(?:/|$) {return 404;}
  location / {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/heji/public/$site/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass app:9000;
    fastcgi_read_timeout 1850s;
  }
 }
}